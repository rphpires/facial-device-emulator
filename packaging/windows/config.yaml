# Facial Device Emulator configuration for the Windows package.
# Environment variables override these values (see docs/configuration.md).

app_version: "1.0.0"

server:
  host: "0.0.0.0"
  port: 7070

# The bundled portable PostgreSQL listens on 5433 so it never collides with
# a PostgreSQL server already installed on the machine.
service_db:
  driver: "postgres"
  host: "127.0.0.1"
  port: 5433
  username: "emulator"
  password: "emulator123"
  database: "emulator_db"

# Service log. Written to stdout; "file" adds a copy on disk, rotated at
# max_size_mb with max_files old copies kept. Overrides: LOG_LEVEL,
# LOG_FORMAT, LOG_FILE.
log:
  level: "info"     # debug, info, warn or error
  format: "text"    # text or json
  file: "logs/trace.log"
