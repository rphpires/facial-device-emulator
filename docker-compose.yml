# Full stack: PostgreSQL + the emulator service.
#
#   docker compose up -d --build
#   open http://localhost:7070
#
# Host ports can be changed without editing this file:
#   WEB_PORT           host port of the web console and REST API (default 7070)
#   DEVICE_PORT_RANGE  host ports published for emulated devices (default 4000-4999)
#
# DEVICE_PORT_RANGE feeds both the port mapping and PUBLISHED_PORT_RANGE, so
# the reachability warning in the console always matches what is published.
# A device whose port is outside the range starts, but cannot be reached
# from outside the container.
services:
  postgres:
    image: postgres:15-alpine
    container_name: facial-device-emulator-db
    environment:
      POSTGRES_USER: emulator
      POSTGRES_PASSWORD: emulator123
      POSTGRES_DB: postgres
    # Not published on the host: the app reaches it on the compose network.
    # Use "docker compose exec postgres psql -U emulator -d emulator_db".
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emulator -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: facial-device-emulator:latest
    container_name: facial-device-emulator-app
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "7070"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: emulator
      DB_PASSWORD: emulator123
      DB_DATABASE: emulator_db
      # Service log: stdout (docker logs) plus this file in the mounted ./logs.
      LOG_FILE: logs/trace.log
      # Must describe exactly what the ports list below publishes.
      PUBLISHED_PORT_RANGE: "${DEVICE_PORT_RANGE:-4000-4999}"
    ports:
      - "${WEB_PORT:-7070}:7070"
      # 1000 device ports (the API's maximum range size). Publishing fewer
      # ports starts faster on Docker Desktop, e.g. DEVICE_PORT_RANGE=4000-4099.
      - "${DEVICE_PORT_RANGE:-4000-4999}:${DEVICE_PORT_RANGE:-4000-4999}"
    depends_on:
      postgres:
        condition: service_healthy
    # Room for the HTTP drain (5 s) plus stopping every device and
    # closing the pools; Docker's default of 10 s can cut that short.
    stop_grace_period: 20s
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data:
